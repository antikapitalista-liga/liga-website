<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Antikapitalista Liga Magyarország</title>

<style>

:root{
    --color-moss-deep:#314738;
    --color-moss-light:#eef3ef;
    --color-paper:#f6f8f6;
    --color-brown:#5a3c1e;
    --color-divider:#d9e1dc;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--color-paper);
    color:#222;
    font-family:"Segoe UI",sans-serif;
    line-height:1.8;
}

.wrapper{
    display:grid;
    grid-template-columns:320px 1fr;
    min-height:100vh;
}

.sidebar{
    background:var(--color-moss-deep);
    color:var(--color-moss-light);
    padding:72px 24px 32px;
}

.sidebar h1{
    margin:0;
    font-family:"Calibri Light","Segoe UI Light",sans-serif;
    font-size:2rem;
    font-weight:400;
    line-height:1.15;
    letter-spacing:.04em;
}

.motto{
    margin-top:4rem;
    color:#e3c37b;
    font-family:"Calibri Light","Segoe UI Light",sans-serif;
    font-size:1rem;
    line-height:1.5;
    font-style:italic;
}

.motto cite{
    display:block;
    margin-top:12px;
    color:var(--color-moss-light);
    font-style:normal;
    font-size:.9rem;
}

.section-title{
    margin-top:4rem;
    margin-bottom:1rem;
    color:#e3c37b;
    font-family:"Calibri Light","Segoe UI Light",sans-serif;
    font-size:1.4rem;
}

.sidebar a{
    display:block;
    margin-bottom:12px;
    color:var(--color-moss-light);
    text-decoration:none;
}

.sidebar a:hover{
    text-decoration:underline;
}

.content{
    display:flex;
    flex-direction:column;
}

.header{
    background:var(--color-paper);
    border-bottom:1px solid var(--color-divider);
    padding:24px 40px;
}

.header h2{
    margin:0;
    color:var(--color-brown);
    font-family:"Calibri Light","Segoe UI Light",sans-serif;
    font-weight:400;
    font-size:2rem;
}

.article{
    max-width:900px;
    padding:48px 40px 80px;
}

.article p{
    max-width:82ch;
}

.article h3{
    color:var(--color-brown);
    font-family:"Calibri Light","Segoe UI Light",sans-serif;
    font-size:1.6rem;
    font-weight:400;
    margin-top:48px;
}

.linkbox{
    margin:20px 0;
    padding:18px 22px;
    background:white;
    border-left:4px solid #6b846d;
}

.linkbox strong{
    display:block;
    margin-bottom:8px;
}

.linkbox a{
    color:#355944;
    text-decoration:none;
}

.linkbox a:hover{
    text-decoration:underline;
}

.note{
    margin-top:48px;
    color:#666;
    font-style:italic;
}

@media (max-width:900px){

    .wrapper{
        grid-template-columns:1fr;
    }

    .sidebar{
        padding:32px 24px;
    }

    .article{
        padding:32px 24px;
    }

    .header{
        padding:24px;
    }
}

</style>
</head>

<body>

<div class="wrapper">

    <aside class="sidebar">

        <h1>
            Antikapitalista Liga<br>
            Magyarország
        </h1>

        <blockquote class="motto">
            „Egy problémát nem lehet ugyanazzal a gondolkodásmóddal megoldani, amellyel létrehoztuk.”
            <cite>Albert Einstein</cite>
        </blockquote>

        <div class="section-title">
            Bekapcsolódás
        </div>

        <a href="https://forms.cloud.microsoft/r/4VUADGHw0U?origin=lprLink">
            Előjelentkezési kérdőív
        </a>

        <a href="https://www.facebook.com/antikapitalista.liga/">
            Facebook közösség
        </a>

    </aside>

    <div class="content">

        <header class="header">
            <h2>Bemutatkozás</h2>
        </header>

        <main class="article">

            <p>
